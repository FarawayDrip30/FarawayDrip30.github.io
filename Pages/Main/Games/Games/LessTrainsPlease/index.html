<!DOCTYPE html>
<head>
    <link href="../../../../../Assets/style.css" rel="stylesheet">
    <style>
        body{
            background-color: purple;
            color: white;
        }

        .normal{

        }
        .fullscreen{
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0px;
            left: 0px;
        }
    </style>
</head>
<body>
    <a href="../../index.html">back</a>
    <h1>Less Trains, Please...?</h1>
    <center>
        <div id="webGameDiv" hidden>
            <iframe id="gameFrame" width="640px" height="360px" frameborder="0" src=""></iframe>
            <br><button id="fullscreenButton">Fullscreen</button>
        </div>
        <button id="playGameButton">Play Game</button>
        <script>
            var inIframe = window.self !== window.top;

            document.getElementById("playGameButton").addEventListener('click', function(){
                if(inIframe){
                    window.top.fullscreen();
                }
                else{
                    document.getElementById("webGameDiv").hidden = false;
                    gameFrame.src = "Web/index.html";
                    document.getElementById("playGameButton").hidden = true;
                }
            });

            var gameFrame = document.getElementById("gameFrame");

            gameFrame.onload = function(){
                gameFrame.contentWindow.addEventListener('keydown', function (e) {
                    if(e.key === "Escape") {
                        console.log("hi")
                        gameFrame.className = "normal";
                    }
                })
            }
            
            document.getElementById("fullscreenButton").addEventListener('click', function(){
                gameFrame.className = "fullscreen";
            });
            
        </script>
    </center>
    <p>Less Trains Please</p>
</body>
