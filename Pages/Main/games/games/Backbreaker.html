<!doctype html>
<html>
    <head>
        <title>Backbreaker</title>
        <style>
            .canvas {
                position: absolute;
            }
        </style>
    </head>
    <body>
        <h2>BACKBREAKER</h2>

        <canvas
            class="canvas"
            id="map_canvas"
            width="500"
            height="400"
        ></canvas>
        <canvas class="canvas" id="canvas" width="500" height="400"></canvas>

        <div style="width: 100%; height: 400px"></div>
        <p>Destroy all the enemies in the stage by running into their backs</p>

        <p>Finished 3rd Feb 2026</p>

        <script>
            var canvas = document.getElementById("canvas");
            var ctx = canvas.getContext("2d");

            var map_canvas = document.getElementById("map_canvas");
            var map_ctx = map_canvas.getContext("2d");

            var keys = {
                up: false,
                down: false,
                left: false,
                right: false,
            };
            var last_keys = structuredClone(keys);
            function get_frame_keys() {
                return {
                    up: keys.up && keys.up != last_keys.up,
                    down: keys.down && keys.down != last_keys.down,
                    left: keys.left && keys.left != last_keys.left,
                    right: keys.right && keys.right != last_keys.right,
                };
            }

            document.addEventListener("keydown", function (e) {
                switch (e.keyCode) {
                    case 38:
                        keys.up = true;
                        break;
                    case 40:
                        keys.down = true;
                        break;
                    case 37:
                        keys.left = true;
                        break;
                    case 39:
                        keys.right = true;
                        break;
                }
            });
            document.addEventListener("keyup", function (e) {
                switch (e.keyCode) {
                    case 38:
                        keys.up = false;
                        break;
                    case 40:
                        keys.down = false;
                        break;
                    case 37:
                        keys.left = false;
                        break;
                    case 39:
                        keys.right = false;
                        break;
                }
            });

            var tile_size = 10;
            var player_size = 8;
            var player_offset = 1;
            var enemy_back_size = 2;

            function drawRect(x, y, w, h, context = ctx) {
                context.beginPath();
                context.rect(x, y, w, h);
                context.fill();
                context.closePath();
            }

            var map = [];

            class Entity {
                constructor(tx, ty) {
                    this.x = tx * tile_size + player_offset;
                    this.y = ty * tile_size + player_offset;
                    this.targetX = tx;
                    this.targetY = ty;

                    this.last_targetX = tx;
                    this.last_targetY = ty;

                    this.dir = "down";
                }

                update() {
                    //if(Math.floor(this.x) != this.targetX * 10){
                    this.x += (this.targetX * 10 - this.x) / 2;
                    //}
                    //if(Math.floor(this.y) != this.targetY * 10){
                    this.y += (this.targetY * 10 - this.y) / 2;
                    //}
                }

                draw() {
                    drawRect(
                        this.get_draw_x(),
                        this.get_draw_y(),
                        player_size,
                        player_size,
                    );
                }

                get_draw_x() {
                    return Math.floor(this.x) + player_offset;
                }
                get_draw_y() {
                    return Math.floor(this.y) + player_offset;
                }

                move(dir) {
                    if (
                        dir == "up" &&
                        !check_map_collision(this.targetX, this.targetY - 1)
                    ) {
                        //this.targetY -= 1;
                        this.set_target(-1, this.targetY - 1);
                    } else if (
                        dir == "down" &&
                        !check_map_collision(this.targetX, this.targetY + 1)
                    ) {
                        //this.targetY += 1;
                        this.set_target(-1, this.targetY + 1);
                    } else if (
                        dir == "left" &&
                        !check_map_collision(this.targetX - 1, this.targetY)
                    ) {
                        //this.targetX -= 1;
                        this.set_target(this.targetX - 1, -1);
                    } else if (
                        dir == "right" &&
                        !check_map_collision(this.targetX + 1, this.targetY)
                    ) {
                        //this.targetX += 1;
                        this.set_target(this.targetX + 1, -1);
                    }

                    this.dir = dir;
                }

                set_target(x, y) {
                    if (x != -1) {
                        this.last_targetX = this.targetX;
                        this.targetX = x;
                    }
                    if (y != -1) {
                        this.last_targetY = this.targetY;
                        this.targetY = y;
                    }
                }
            }

            class Player extends Entity {
                constructor(x, y) {
                    super(x, y);
                }

                move(dir) {
                    let last_last_targetX = this.last_targetX;
                    let last_last_targetY = this.last_targetY;

                    let lx = this.targetX;
                    let ly = this.targetY;

                    super.move(dir);

                    for (let i = 0; i < enemies.length; i++) {
                        if (
                            check_entity_collision(
                                this.targetX,
                                this.targetY,
                                enemies[i].targetX,
                                enemies[i].targetY,
                            )
                        ) {
                            if (!check_came_from_behind(this, enemies[i])) {
                                this.set_target(lx, ly);
                                this.last_targetX = last_last_targetX;
                                this.last_targetY = last_last_targetY;
                            }
                        }
                    }
                }
            }

            var enemy_max_timer = 40;
            var move_options = ["up", "down", "left", "right"];
            var move_rules = {
                up: ["left", "right"],
                down: ["left", "right"],
                left: ["up", "down"],
                right: ["up", "down"],
            };

            class Enemy extends Entity {
                constructor(x, y) {
                    super(x, y);
                    this.action_timer = enemy_max_timer;
                }

                update() {
                    this.action_timer--;
                    if (this.action_timer <= 0) {
                        this.move(
                            move_rules[this.dir][
                                Math.floor(
                                    Math.random() * move_rules[this.dir].length,
                                )
                            ],
                        );
                        this.action_timer = enemy_max_timer;
                    }

                    super.update();
                }

                draw() {
                    super.draw();

                    ctx.fillStyle = "orange";
                    switch (this.dir) {
                        case "up":
                            drawRect(
                                this.get_draw_x(),
                                this.get_draw_y() +
                                    player_size -
                                    enemy_back_size,
                                player_size,
                                enemy_back_size,
                            );
                            break;
                        case "down":
                            drawRect(
                                this.get_draw_x(),
                                this.get_draw_y(),
                                player_size,
                                enemy_back_size,
                            );
                            break;
                        case "left":
                            drawRect(
                                this.get_draw_x() +
                                    player_size -
                                    enemy_back_size,
                                this.get_draw_y(),
                                enemy_back_size,
                                player_size,
                            );
                            break;
                        case "right":
                            drawRect(
                                this.get_draw_x(),
                                this.get_draw_y(),
                                enemy_back_size,
                                player_size,
                            );
                            break;
                    }
                }
            }

            function spawn_enemy() {
                for (
                    let y = Math.floor(Math.random() * map.length);
                    y < map.length;
                    y++
                ) {
                    for (
                        let x = Math.floor(Math.random() * map[y].length);
                        x < map[y].length;
                        x++
                    ) {
                        if (map[y][x] == 0) {
                            enemies.push(new Enemy(x, y));
                            return;
                        }
                    }
                }
            }

            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                //draw_map();

                let frame_keys = get_frame_keys();
                if (frame_keys.up) {
                    player.move("up");
                }
                if (frame_keys.down) {
                    player.move("down");
                }
                if (frame_keys.left) {
                    player.move("left");
                }
                if (frame_keys.right) {
                    player.move("right");
                }

                ctx.fillStyle = "red";
                player.update();
                player.draw();

                for (let i = 0; i < enemies.length; i++) {
                    if (
                        check_entity_collision(
                            player.targetX,
                            player.targetY,
                            enemies[i].targetX,
                            enemies[i].targetY,
                        )
                    ) {
                        console.log("collision");
                        if (check_came_from_behind(player, enemies[i])) {
                            enemies.splice(i, 1);
                            if (enemies.length == 0) {
                                alert("You Win!");
                                start_game();
                            } else if (enemies.length <= 5) {
                                enemy_max_timer = 30;
                            }
                            continue;
                        } else {
                            //if (check_came_from_behind(enemies[i], player)) {
                            alert("You Died");
                            start_game();
                        }
                    }

                    enemies[i].update();
                    ctx.fillStyle = "green";
                    enemies[i].draw();
                }

                ctx.fillStyle = "black";

                last_keys = structuredClone(keys);
            }

            function create_map() {
                for (let y = 0; y < 400 / tile_size; y++) {
                    map.push([]);
                    for (let x = 0; x < 500 / tile_size; x++) {
                        map[y].push(Math.floor(Math.random() + 0.2));
                    }
                }
            }

            function draw_map() {
                for (let y = 0; y < map.length; y++) {
                    for (let x = 0; x < map[y].length; x++) {
                        if (map[y][x] == 1) {
                            drawRect(
                                x * tile_size,
                                y * tile_size,
                                tile_size,
                                tile_size,
                                map_ctx,
                            );
                        }
                    }
                }
            }

            function check_map_collision(x, y) {
                return (
                    !(
                        x >= 0 &&
                        y >= 0 &&
                        x < map[0].length &&
                        y < map.length
                    ) || map[Math.floor(y)][Math.floor(x)] == 1
                );
            }

            function check_entity_collision(x1, y1, x2, y2) {
                return x1 == x2 && y1 == y2;
            }
            function check_came_from_behind(entity1, entity2) {
                return (
                    (entity2.dir == "up" &&
                        entity1.dir == "up" &&
                        entity1.last_targetY > entity2.targetY) ||
                    (entity2.dir == "down" &&
                        entity1.dir == "down" &&
                        entity1.last_targetY < entity2.targetY) ||
                    (entity2.dir == "left" &&
                        entity1.dir == "left" &&
                        entity1.last_targetX > entity2.targetX) ||
                    (entity2.dir == "right" &&
                        entity1.dir == "right" &&
                        entity1.last_targetX < entity2.targetX)
                );
            }

            var enemies = [];
            var player = new Player(0, 0);

            function start_game() {
                map_ctx.clearRect(0, 0, map_canvas.width, map_canvas.height);
                map = [];
                create_map();
                draw_map();

                enemy_max_timer = 40;
                enemies = [];
                for (let i = 0; i < 10; i++) {
                    spawn_enemy();
                }

                player = new Player(0, 0);
            }
            start_game();

            setInterval(function () {
                update();
            }, 1000 / 60);
        </script>
    </body>
</html>
