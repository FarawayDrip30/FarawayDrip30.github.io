<!doctype html>
<head>
    <title>Faraway's Awesome News</title>
    <style>
        body {
            background-color: blue;
            color: white;
            font-family: sans-serif;
        }
        a {
            color: white;
            text-decoration: underline;
        }
        .news_title:hover {
            cursor: pointer;
        }
        .newsDiv {
            border-width: 1px;
            border-style: solid;
            border-color: white;
            background-color: darkblue;
            margin: 8px;
            padding: 6px;
        }
    </style>
</head>
<body>
    <h2><a target="_blank" href="../../rss/index.html">Add the RSS Feed</a></h2>
    <br />
    <div id="news_div"></div>
    <script>
        // Get File
        fetch("../../../rss.xml").then((data) => {
            data.text().then((text) => {
                //console.log(text);
                let news_div = document.getElementById("news_div");

                let parser = new DOMParser();
                let xml = parser.parseFromString(text, "text/xml");

                let items = xml.getElementsByTagName("item");

                for (let i = 0; i < items.length; i++) {
                    news_div.innerHTML +=
                        "<a class='news_title' id='title" +
                        i +
                        "'>" +
                        items[i].getElementsByTagName("title")[0].innerHTML +
                        "</a><br>" +
                        "<div id='news" +
                        i +
                        "' class='newsDiv' hidden>" +
                        items[i]
                            .getElementsByTagName("description")[0]
                            .innerHTML.substr(
                                0,
                                items[i].getElementsByTagName("description")[0]
                                    .innerHTML.length - 4,
                            ) +
                        "</div>";
                }
                for (let i = 0; i < items.length; i++) {
                    document
                        .getElementById("title" + i)
                        .addEventListener("click", (e) => {
                            console.log(e);
                            let temp_news = document.getElementById("news" + i);
                            temp_news.hidden = !temp_news.hidden;
                        });
                }
            });
        });
    </script>
