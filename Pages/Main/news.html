<!doctype html>
<head>
    <title>Faraway's Awesome News</title>
    <style>
        body {
            background-color: blue;
            color: white;
            font-family: sans-serif;
        }
        a {
            color: white;
            text-decoration: underline;
        }
        .news_title:hover {
            cursor: pointer;
        }
        .newsDiv {
            border-width: 1px;
            border-style: solid;
            border-color: white;
            background-color: darkblue;
            margin: 8px;
            padding: 6px;

            width: 600px;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <center>
        <h2><a target="_blank" href="../../rss/index.html">Add the RSS Feed</a></h2>
        <br />
        <div id="news_div"></div>
    </center>

    <script>
        function toggle_hidden(div_id){
            let temp_div = document.getElementById(div_id);
            temp_div.hidden = !temp_div.hidden;
        }

        function go_to_news_post(post_guid){
            console.log(post_guid);
            document.getElementById("news_" + post_guid).hidden = false;
            document.getElementById("post_" + post_guid).scrollIntoView({ behavior: "smooth", block: "start" });
        }

        // Get File
        fetch("../../rss/rss.xml").then((data) => {
            data.text().then((text) => {
                //console.log(text);
                let news_div = document.getElementById("news_div");

                let parser = new DOMParser();
                let xml = parser.parseFromString(text, "text/xml");

                let items = xml.getElementsByTagName("item");

                for (let i = 0; i < items.length; i++) {
                    let guid = items[i].getElementsByTagName("guid")[0].innerHTML
                    news_div.innerHTML +=
                        "<a class='news_title' id='post_" + guid + "' onclick='toggle_hidden(\"news_" + guid + "\")'>" +
                            items[i].getElementsByTagName("title")[0].innerHTML +
                        "</a><br>" +
                        "<div id='news_" + guid + "' class='newsDiv' hidden>" +
                            items[i].getElementsByTagName("description")[0].innerHTML.substr(
                                0, items[i].getElementsByTagName("description")[0].innerHTML.search("]]>"))
                         +"</div><br>";
                            
                    //console.log(items[i].getElementsByTagName("description")[0].innerHTML.substr(0, items[i].getElementsByTagName("description")[0].innerHTML.search("]]>")))
                }

                let element_start = window.location.href.search("#");
                if(element_start != -1){
                    console.log(window.location.href.substr(element_start + 1));
                    go_to_news_post(window.location.href.substr(element_start + 1));
                }
            });
        });
    </script>
</body>
